name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "scripts/**"
      - "ts-api/**"
      - "domain-mapping.yaml"
      - "Dockerfile"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # --- Build the image locally (don't push yet) ---

      # A release is a pushed git tag `vX.Y.Z`. Refuse to publish one whose
      # version does not match package.json — otherwise the image tag, the
      # /health endpoint and CHANGELOG.md would disagree about what shipped.
      - name: Verify release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi
          if ! grep -q "^## \[$PKG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for [$PKG_VERSION]."
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: trustsource/ts-mcp
          tags: |
            # Branch builds: a moving tag per branch. DEV pulls :main.
            type=ref,event=branch
            # Every build stays addressable by commit.
            type=sha,prefix=,format=short
            # Releases only (git tag vX.Y.Z): :X.Y.Z and the floating :X.Y
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest moves only on a release, never on a branch build.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single platform on purpose: `load: true` cannot load a multi-platform
      # manifest list into the docker daemon, and ts-scan needs one concrete
      # image to scan. amd64 is representative -- the npm dependency set is
      # identical across platforms, only the compiled binaries differ.
      - name: Build image for scanning (local only, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: trustsource/ts-mcp:scan-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Scan with ts-scan using Syft backend, then upload to TrustSource ---

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install ts-scan
        run: pip install "ts-scan>=1.7.0"

      - name: Scan Docker image
        run: |
          ts-scan scan \
            --use-syft \
            --tag "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            -o scan-results.json \
            docker:trustsource/ts-mcp:scan-candidate

      - name: Upload scan to TrustSource and gate on results
        id: scan-gate
        env:
          TS_API_KEY: ${{ secrets.TRUSTSOURCE_API_KEY }}
        run: |
          set -euo pipefail
          ts-scan upload \
            --api-key "$TS_API_KEY" \
            --project-name "ts-mcp" \
            --wait-for-analysis \
            --wait-timeout 300 \
            --exit-on-vulns \
            --Werror \
            scan-results.json

      # --- Only push to Docker Hub if scan passed ---

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.FRED4TS2DH }}

      - name: Push image to Docker Hub
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the amd64 layers built for the scan above, so the published
          # amd64 image is the one that actually passed the gate.
          cache-from: type=gha
          cache-to: type=gha,mode=max
